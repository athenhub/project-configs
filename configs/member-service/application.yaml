server:
  port: 9012

spring:
  cloud:
    gateway:
      routes:
        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/v1/member/**
          filters:
            - 'RewritePath=/v1/member/(?<path>.*), /\${path}'

  jpa:
    properties:
      hibernate:
        default_schema: member_service # 이 서비스에서 기본으로 사용할 DB 스키마 이름
